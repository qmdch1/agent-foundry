[project]
name = "agent-foundry"
version = "0.1.0"
description = "Registry-driven agent with an asynchronous, isolated Python tool builder"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "psycopg[binary,pool]>=3.2,<4",
  "jsonschema>=4.23,<5", "regex>=2024.11", "cryptography>=44,<50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
foundry = "agent_foundry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires FOUNDRY_TEST_DATABASE_URL", "docker: requires Docker sandbox image"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
